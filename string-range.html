<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JQD4RVE06"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0JQD4RVE06');
    </script>
      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PV String Range Calculator</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* Верхняя панель управления */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .home-btn {
            background: #eee;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .home-btn:active { background: #e0e0e0; transform: scale(0.95); }

        .tool-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            flex-grow: 1;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .lang-switch { display: flex; gap: 4px; }

        .lang-btn {
            padding: 6px 5px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: white;
            min-width: 30px;
            text-align: center;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Форма */
        .input-group { margin-top: 12px; }
        label { font-size: 12px; display: block; color: #555; margin-bottom: 4px; font-weight: 500; }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box; 
            transition: 0.2s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(42, 140, 255, 0.1); }

        .calc-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .calc-btn:active { transform: scale(0.98); opacity: 0.9; }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            background: #fafafa;
            word-wrap: break-word;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }

        .result.show { opacity: 1; transform: translateY(0); display: block; }

        .copy-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            font-weight: 600;
        }
        .copy-btn.copied { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <a href="index.html" class="home-btn">🏠</a>
        <div class="tool-title" id="title">String Range</div>
        <div class="lang-switch">
            <div class="lang-btn" data-lang="ru">RU</div>
            <div class="lang-btn" data-lang="ua">UA</div>
            <div class="lang-btn" data-lang="en">EN</div>
            <div class="lang-btn" data-lang="pl">PL</div>
        </div>
    </div>

    <div class="input-group"><label id="l1"></label><input type="number" id="v_voc" step="any"></div>
    <div class="input-group"><label id="l2"></label><input type="number" id="v_vmp" step="any"></div>
    <div class="input-group"><label id="l3"></label><input type="number" id="kv" step="any"></div>
    <div class="input-group"><label id="l4"></label><input type="number" id="t_min" step="any"></div>
    <div class="input-group"><label id="l5"></label><input type="number" id="t_max" step="any"></div>
    <div class="input-group"><label id="l6"></label><input type="number" id="v_mppt_max" step="any"></div>
    <div class="input-group"><label id="l7"></label><input type="number" id="v_mppt_min" step="any"></div>

    <button onclick="calculate()" id="calcBtn" class="calc-btn"></button>

    <div class="result" id="result"></div>
    <button id="copyBtn" class="copy-btn"></button>
</div>

<script>
const T = {
    ru: {
        title: "Оптимальное кол-во модулей",
        l1: "Voc модуля (STC) (V)", 
        l2: "Vmp модуля (STC) (V)",
        l3: "Температурный коэффициент Voc (%)", 
        l4: "Мин. температура объекта (°C)",
        l5: "Макс. температура объекта (°C)", 
        l6: "Макс. предел MPPT инвертора (V)",
        l7: "Мин. предел MPPT инвертора (V)", 
        ph: "Напр: ", calc: "Рассчитать диапазон",
        empty: "⚠️ Заполните все поля", copyBtn: "📋 Скопировать отчет",
        copied: "✅ Скопировано!", res_min: "Минимум в стринге",
        res_max: "максимум", pcs: "шт."
    },
    ua: {
        title: "Оптимальна кількість модулів",
        l1: "Voc модуля (STC) (V)", 
        l2: "Vmp модуля (STC) (V)",
        l3: "Температурний коефіцієнт Voc (%)", 
        l4: "Мін. температура об'єкта (°C)",
        l5: "Макс. температура об'єкта (°C)", 
        l6: "Макс. межа MPPT інвертора (V)",
        l7: "Мін. межа MPPT інвертора (V)", 
        ph: "Напр: ", calc: "Розрахувати діапазон",
        empty: "⚠️ Заповніть всі поля", copyBtn: "📋 Копіювати звіт",
        copied: "✅ Скопійовано!", res_min: "Мінімум у стрингу",
        res_max: "максимум", pcs: "шт."
    },
    en: {
        title: "Optimal Module Range",
        l1: "Module Voc (STC) (V)", 
        l2: "Module Vmp (STC) (V)",
        l3: "Temp. coefficient Voc (%)", 
        l4: "Min ambient temperature (°C)",
        l5: "Max ambient temperature (°C)", 
        l6: "Max MPPT voltage (V)",
        l7: "Min MPPT voltage (V)", 
        ph: "Ex: ", calc: "Calculate Range",
        empty: "⚠️ Fill all fields", copyBtn: "📋 Copy report",
        copied: "✅ Copied!", res_min: "Min modules in string",
        res_max: "maximum", pcs: "pcs."
    },
    pl: {
        title: "Optymalna liczba modułów",
        l1: "Voc modułu (STC) (V)", 
        l2: "Vmp modułu (STC) (V)",
        l3: "Współczynnik temp. Voc (%)", 
        l4: "Min. temperatura otoczenia (°C)",
        l5: "Max. temperatura otoczenia (°C)", 
        l6: "Max zakres MPPT falownika (V)",
        l7: "Min zakres MPPT falownika (V)", 
        ph: "Przykład: ", calc: "Oblicz zakres",
        empty: "⚠️ Uzupełnij pola", copyBtn: "📋 Skopiuj raport",
        copied: "✅ Skopiowano!", res_min: "Minimum w stringu",
        res_max: "maksimum", pcs: "szt."
    }
};

let lastCalcData = null;

function applyLang(lang) {
    if (!T[lang]) lang = 'ru';
    localStorage.setItem("lang", lang);
    const t = T[lang];
    
    document.getElementById('title').textContent = t.title;
    document.getElementById('l1').textContent = t.l1;
    document.getElementById('l2').textContent = t.l2;
    document.getElementById('l3').textContent = t.l3;
    document.getElementById('l4').textContent = t.l4;
    document.getElementById('l5').textContent = t.l5;
    document.getElementById('l6').textContent = t.l6;
    document.getElementById('l7').textContent = t.l7;
    
    document.getElementById('v_voc').placeholder = t.ph + "41.5";
    document.getElementById('v_vmp').placeholder = t.ph + "42.7";
    document.getElementById('kv').placeholder = t.ph + "-0.29";
    document.getElementById('t_min').placeholder = t.ph + "-25";
    document.getElementById('t_max').placeholder = t.ph + "30";
    document.getElementById('v_mppt_max').placeholder = t.ph + "1100";
    document.getElementById('v_mppt_min').placeholder = t.ph + "125";

    document.getElementById('calcBtn').textContent = t.calc;
    document.getElementById('copyBtn').textContent = t.copyBtn;
    
    document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
    });
}

document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

window.addEventListener('DOMContentLoaded', () => {
    applyLang(localStorage.getItem("lang") || "ru");
});

function getNum(id) {
    const val = document.getElementById(id).value.replace(',', '.').trim();
    return val === "" ? NaN : parseFloat(val);
}

function calculate() {
    const lang = localStorage.getItem("lang") || "ru";
    const t = T[lang];
    
    const v_voc = getNum('v_voc');
    const v_vmp = getNum('v_vmp');
    const kv = getNum('kv');
    const t_min = getNum('t_min');
    const t_max = getNum('t_max');
    const mppt_max = getNum('v_mppt_max');
    const mppt_min = getNum('v_mppt_min');

    const resDiv = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');

    if (isNaN(v_voc) || isNaN(v_vmp) || isNaN(kv) || isNaN(t_min) || isNaN(t_max) || isNaN(mppt_max) || isNaN(mppt_min)) {
        resDiv.textContent = t.empty;
        resDiv.style.display = "block";
        resDiv.classList.add("show");
        copyBtn.style.display = "none";
        return;
    }

    const min_pcs = Math.ceil(mppt_min / (v_vmp * (1 + (t_max - 25) * (kv / 100))));
    const max_pcs = Math.floor(mppt_max / (v_voc * (1 + (t_min - 25) * (kv / 100))));

    const resultString = `✅ ${t.res_min}: ${min_pcs} ${t.pcs}<br>✅ ${t.res_max}: ${max_pcs} ${t.pcs}`;
    
    lastCalcData = {
        title: t.title,
        inputs: [
            { label: t.l1, val: v_voc, unit: "V" },
            { label: t.l2, val: v_vmp, unit: "V" },
            { label: t.l3, val: kv, unit: "%" },
            { label: t.l4, val: t_min, unit: "°C" },
            { label: t.l5, val: t_max, unit: "°C" },
            { label: t.l6, val: mppt_max, unit: "V" },
            { label: t.l7, val: mppt_min, unit: "V" }
        ],
        result: `${t.res_min}: ${min_pcs} ${t.pcs} / ${t.res_max}: ${max_pcs} ${t.pcs}`
    };

    resDiv.innerHTML = resultString;
    resDiv.style.display = "block";
    resDiv.classList.remove("show");
    setTimeout(() => resDiv.classList.add("show"), 20);
    copyBtn.style.display = "block";
}

document.getElementById('copyBtn').addEventListener('click', function() {
    if (!lastCalcData) return;
    const t = T[localStorage.getItem("lang") || "ru"];
    
    let text = `⚡ ${lastCalcData.title}\n\n`;
    lastCalcData.inputs.forEach(item => {
        text += `🔹 ${item.label}: ${item.val} ${item.unit}\n`;
    });
    text += `\n📊 РЕЗУЛЬТАТ:\n${lastCalcData.result}`;

    navigator.clipboard.writeText(text).then(() => {
        const originalText = t.copyBtn;
        this.textContent = t.copied;
        this.classList.add("copied");
        setTimeout(() => {
            this.textContent = originalText;
            this.classList.remove("copied");
        }, 2000);
    });
});
</script>
</body>
</html>
