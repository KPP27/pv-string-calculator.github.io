<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JQD4RVE06"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0JQD4RVE06');
    </script>
      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PV String Calculator</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* Верхняя панель управления */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .home-btn {
            background: #eee;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .home-btn:active { background: #e0e0e0; transform: scale(0.95); }

        .tool-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            flex-grow: 1;
            line-height: 1.2;
        }

        .lang-switch { display: flex; gap: 4px; }

        .lang-btn {
            padding: 6px 5px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: white;
            min-width: 30px;
            text-align: center;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Форма */
        label { font-size: 13px; margin-top: 14px; display: block; color: #555; font-weight: 500; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box; 
            transition: 0.2s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(42, 140, 255, 0.1); }

        .calc-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .calc-btn:active { transform: scale(0.98); opacity: 0.9; }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            background: #fafafa;
            word-wrap: break-word;
            display: none;
        }

        .result.show { opacity: 1; transform: translateY(0); display: block; }

        .copy-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            font-weight: 600;
        }
        
        .copy-btn.copied { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <a href="index.html" class="home-btn">🏠</a>
        <div class="tool-title" id="title">PV Calculator</div>
        <div class="lang-switch">
            <div class="lang-btn" data-lang="ru">RU</div>
            <div class="lang-btn" data-lang="ua">UA</div>
            <div class="lang-btn" data-lang="en">EN</div>
            <div class="lang-btn" data-lang="pl">PL</div>
        </div>
    </div>

    <label id="l1"></label>
    <input type="number" id="E13" step="any">

    <label id="l2"></label>
    <input type="number" id="E14" step="any">

    <label id="l3"></label>
    <input type="number" id="E15" step="any">

    <label id="l4"></label>
    <input type="number" id="E16" step="any">

    <button onclick="calculate()" id="calcBtn" class="calc-btn"></button>

    <div class="result" id="result"></div>
    <button id="copyBtn" class="copy-btn"></button>
</div>

<script>
const T = {
    ru: {
        title: "МАКСИМАЛЬНЫЙ СТРИНГ",
        l1: "Макс. DC напряжение инвертора (V)",
        l2: "Voc модуля (STC) (V)",
        l3: "Мин. температура объекта (°C)",
        l4: "Темп. коэффициент Voc (%)",
        ph1: "1100", ph2: "41.5", ph3: "-25", ph4: "-0.29",
        calc: "Рассчитать", empty: "⚠️ Заполните все поля",
        result: "🔋 Макс. модулей в стринге: ", copyBtn: "📋 Скопировать отчет",
        copied: "✅ Скопировано!", calculatedVoc: "📊 Расчетный Voc", explanation: "при мин. температуре"
    },
    ua: {
        title: "МАКСИМАЛЬНИЙ ЛАНЦЮГ",
        l1: "Макс. DC напруга інвертора (V)",
        l2: "Voc модуля (STC) (V)",
        l3: "Мін. температура об'єкта (°C)",
        l4: "Темп. коефіцієнт Voc (%)",
        ph1: "1100", ph2: "41.5", ph3: "-25", ph4: "-0.29",
        calc: "Розрахувати", empty: "⚠️ Заповніть всі поля",
        result: "🔋 Макс. модулів у ланцюзі: ", copyBtn: "📋 Копіювати звіт",
        copied: "✅ Скопійовано!", calculatedVoc: "📊 Розрахунковий Voc", explanation: "при мін. температурі"
    },
    en: {
        title: "MAX STRING LENGTH",
        l1: "Max DC input voltage (V)",
        l2: "Module Voc (STC) (V)",
        l3: "Min ambient temperature (°C)",
        l4: "Temp. coefficient Voc (%)",
        ph1: "1100", ph2: "41.5", ph3: "-25", ph4: "-0.29",
        calc: "Calculate", empty: "⚠️ Fill all fields",
        result: "🔋 Max modules in string: ", copyBtn: "📋 Copy report",
        copied: "✅ Copied!", calculatedVoc: "📊 Calculated Voc", explanation: "at min. temperature"
    },
    pl: {
        title: "MAX DŁUGOŚĆ STRINGU",
        l1: "Max napięcie DC falownika (V)",
        l2: "Voc modułu (STC) (V)",
        l3: "Min. temperatura otoczenia (°C)",
        l4: "Współczynnik temp. Voc (%)",
        ph1: "1100", ph2: "41.5", ph3: "-25", ph4: "-0.29",
        calc: "Oblicz", empty: "⚠️ Uzupełnij pola",
        result: "🔋 Max modułów w stringu: ", copyBtn: "📋 Skopiuj raport",
        copied: "✅ Skopiowano!", calculatedVoc: "📊 Obliczony Voc", explanation: "przy min. temp."
    }
};

let lastCalc = null;

function applyLang(lang) {
    if (!T[lang]) lang = 'ru';
    localStorage.setItem("lang", lang);
    const t = T[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('l1').textContent = t.l1;
    document.getElementById('l2').textContent = t.l2;
    document.getElementById('l3').textContent = t.l3;
    document.getElementById('l4').textContent = t.l4;
    document.getElementById('E13').placeholder = t.ph1;
    document.getElementById('E14').placeholder = t.ph2;
    document.getElementById('E15').placeholder = t.ph3;
    document.getElementById('E16').placeholder = t.ph4;
    document.getElementById('calcBtn').textContent = t.calc;
    document.getElementById('copyBtn').textContent = t.copyBtn;

    document.querySelectorAll(".lang-btn").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.lang === lang)
    );
}

document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = () => applyLang(btn.dataset.lang);
});

applyLang(localStorage.getItem("lang") || "ru");

function getNum(id) {
    const val = document.getElementById(id).value.replace(',', '.').trim();
    return val === "" ? NaN : parseFloat(val);
}

function calculate() {
    const lang = localStorage.getItem("lang") || "ru";
    const t = T[lang];
    
    const v_inv = getNum('E13');
    const v_voc = getNum('E14');
    const t_min = getNum('E15');
    const t_coeff = getNum('E16');
    
    const resDiv = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');

    if (isNaN(v_inv) || isNaN(v_voc) || isNaN(t_min) || isNaN(t_coeff)) {
        resDiv.textContent = t.empty;
        resDiv.style.display = "block";
        resDiv.classList.add("show");
        copyBtn.style.display = "none";
        return;
    }

    const vocCorr = v_voc * (1 + (t_min - 25) * (t_coeff / 100));
    const count = Math.floor(v_inv / vocCorr);

    lastCalc = {
        title: t.title,
        l1: t.l1, v1: v_inv,
        l2: t.l2, v2: v_voc,
        l3: t.l3, v3: t_min,
        l4: t.l4, v4: t_coeff,
        calcVocLabel: t.calculatedVoc, calcVocVal: vocCorr.toFixed(2),
        expl: t.explanation,
        resLabel: t.result, resVal: count
    };

    resDiv.innerHTML = `${t.result} ${count}<br><small style="font-weight:normal; opacity:0.7">${t.calculatedVoc}: ${vocCorr.toFixed(2)} V</small>`;
    resDiv.style.display = "block";
    resDiv.classList.remove("show");
    setTimeout(() => resDiv.classList.add("show"), 20);
    copyBtn.style.display = "block";
}

document.getElementById('copyBtn').onclick = function() {
    if(!lastCalc) return;
    const t = T[localStorage.getItem("lang") || "ru"];
    let text = `⚡ ${lastCalc.title}\n\n`;
    text += `🔹 ${lastCalc.l1}: ${lastCalc.v1} V\n`;
    text += `🔹 ${lastCalc.l2}: ${lastCalc.v2} V\n`;
    text += `🔹 ${lastCalc.l3}: ${lastCalc.v3} °C\n`;
    text += `🔹 ${lastCalc.l4}: ${lastCalc.v4}%\n`;
    text += `📊 ${lastCalc.calcVocLabel}: ${lastCalc.calcVocVal} V (${lastCalc.expl})\n\n`;
    text += `✅ ${lastCalc.resLabel} ${lastCalc.resVal}`;
    
    navigator.clipboard.writeText(text).then(() => {
        const originalText = t.copyBtn;
        this.textContent = t.copied;
        this.classList.add("copied");
        setTimeout(() => {
            this.textContent = originalText;
            this.classList.remove("copied");
        }, 2000);
    });
};
</script>
</body>
</html>
